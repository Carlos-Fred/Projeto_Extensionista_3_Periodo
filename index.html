<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden Garden — Bar & Gastronomia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#" aria-label="Golden Garden">
      <span class="logo-mark">GG</span>
      <span><strong>GOLDEN GARDEN</strong><small>Bar &amp; Gastronomia</small></span>
    </a>
    <label class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por prato, petisco ou bebida..." autocomplete="off">
    </label>
    <button id="openCart" class="cart-btn" aria-label="Abrir comanda">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 2h12a1 1 0 0 1 1 1v18l-3-2-3 2-3-2-3 2V3a1 1 0 0 1 1-1zm2 5v2h8V7H8zm0 4v2h8v-2H8z"/></svg>
      Comanda <span id="count" class="badge">0</span>
    </button>
  </div>
  <nav id="tabs" class="tabs" aria-label="Categorias"></nav>
</header>

<main id="menu" class="wrap"></main>

<div id="overlay" class="overlay"></div>
<aside id="drawer" class="drawer" aria-label="Sua comanda" aria-hidden="true">
  <div class="d-head">
    <span class="d-icon">🧾</span>
    <div><h2>Sua Comanda</h2><p>Resumo dos seus itens selecionados</p></div>
    <button id="closeCart" class="x" aria-label="Fechar comanda">✕</button>
  </div>
  <div id="lines" class="lines"></div>
  <div class="d-foot">
    <div class="sum"><span>Subtotal</span><strong id="sub">R$ 0,00</strong></div>
    <div class="sum small"><span>Taxa de serviço (10% sugerida)</span><span id="fee">R$ 0,00</span></div>
    <div class="sum total"><span>Total</span><strong id="total">R$ 0,00</strong></div>
    <button id="clear" class="clear">Limpar comanda</button>
  </div>
</aside>

<script src="script.js"></script>
</body>
</html>
